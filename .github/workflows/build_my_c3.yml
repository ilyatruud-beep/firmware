name: Build C3 SuperMini E220
on:
  push:
    paths:
      - '.github/workflows/build_my_c3.yml'
      - 'variants/esp32c3/c3_supermini_e220/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PlatformIO
        run: |
          pip install -U platformio
          find / -name "version.py" -path "*platformio*" -exec sed -i 's/6\.2\.0-post\.1/6.2.1/g' {} + 2>/dev/null || true
          find / -name "METADATA" -path "*platformio*" -exec sed -i 's/6\.2\.0-post\.1/6.2.1/g' {} + 2>/dev/null || true
      - name: Build firmware
        run: |
          pio pkg install -g -p "https://github.com" || true
          find ~/.platformio -name "platform.json" -exec sed -i 's/>=6\.2\.0/>=6.0.0/g' {} + 2>/dev/null || true
          pio run -e c3_supermini_e220
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-c3_supermini_e220
          path: .pio/build/c3_supermini_e220/*.bin
